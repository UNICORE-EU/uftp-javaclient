# This workflow runs integration tests using
# the unicore-testing-all Docker container

name: Test the package (.zip file) vs UFTP docker container

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  integration-test:

    runs-on: ubuntu-latest

    services:
      unicore:
        image: ghcr.io/unicore-eu/uftp-testing-all:3.5.2
        ports:
          - 9000:9000
          - 64434:64434
          - 50000-50050:50000-50050

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Integration tests
      run: make integration-test
    - uses: actions/upload-artifact@v7
      with:
        name: uftp-client.zip
        path: target/uftp-client-*.zip
